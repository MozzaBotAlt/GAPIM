<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="College display maintenance" />
    <title>Maintenance | Your College</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="maintenance-page">
    <main class="maintenance-shell">
      <div class="maintenance-watermark" aria-hidden="true" data-college-name>Your College</div>
      <div class="maintenance-content">
        <p class="maintenance-status"><span aria-hidden="true"></span> SYSTEM UPDATE</p>
        <h1>Maintenance in progress</h1>
        <p class="maintenance-subtitle">We will be back.</p>
        <time id="maintenance-clock">--:--:--</time>
        <p id="maintenance-date"></p>
      </div>
    </main>
    <script src="../config.js"></script>
    <script src="../script.js"></script>

    <footer class="brand-footer">
      <span data-college-footer>&copy; Your College</span>
    </footer>
  </body>
</html>
